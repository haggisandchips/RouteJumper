name: Release

# Pushing a tag like v1.0.0 is the only manual step - this builds ED:FC Auto Pilot,
# packs it with Velopack, and publishes it as a GitHub Release. UpdateService
# (RouteJumper/Services/UpdateService.cs) then picks it up automatically on
# every installed copy's next launch. See the docs' "Packaging & distributing
# releases via GitHub" section (docs/development.md) for the equivalent manual steps.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install -g vpk
          echo "${HOME}/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Download previous release (for delta packages)
        shell: bash
        # Best-effort: a fresh repo with no releases yet has nothing to download,
        # in which case vpk pack below just produces a full package instead of a delta.
        continue-on-error: true
        run: >
          vpk download github --repoUrl https://github.com/haggisandchips/RouteJumper
          --token ${{ secrets.GITHUB_TOKEN }} -o Releases

      - name: Publish
        shell: bash
        run: >
          dotnet publish RouteJumper/RouteJumper.csproj
          -c Release -r win-x64 --self-contained true
          -o publish/win-x64

      - name: Pack with Velopack
        shell: bash
        run: >
          vpk pack -u EDFCAutoPilot -v ${{ steps.version.outputs.version }}
          -p publish/win-x64 -e EDFCAutoPilot.exe
          -i RouteJumper/Resources/AppIcon.ico

      - name: Upload release to GitHub
        shell: bash
        run: >
          vpk upload github --repoUrl https://github.com/haggisandchips/RouteJumper
          --token ${{ secrets.GITHUB_TOKEN }} --tag ${{ github.ref_name }} --publish

      - name: Announce release on Discord
        # Requires a DISCORD_WEBHOOK repo secret (Discord: channel Settings >
        # Integrations > Webhooks). Skipped harmlessly if it isn't set, so this
        # workflow still works in a fork with no Discord server configured.
        #
        # The JSON payload is written to a file rather than passed as a curl
        # command-line argument: on windows-latest, argv is down-converted from
        # UTF-16 to the legacy ANSI codepage before curl.exe sees it, which
        # mangles the emoji (a UTF-16 surrogate pair) into "??". Writing it to
        # a file first and having curl read that file avoids the conversion.
        if: env.DISCORD_WEBHOOK != ''
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > discord-payload.json <<EOF
          {"content": "🚀 **ED:FC Auto Pilot v${VERSION}** has been released!\nhttps://github.com/haggisandchips/RouteJumper/releases/tag/${TAG}"}
          EOF
          curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" --data-binary @discord-payload.json
